<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABSENSI SISWA X TKJ</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#001b4d,#0066cc,#00aaff);
  padding:20px;
  color:white;
}

.container{
  max-width:500px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:27px;
  margin:5px 0;
}

.subtitle{
  text-align:center;
  margin-bottom:18px;
}

.clock{
  text-align:center;
  background:#004fa8;
  padding:18px;
  border-radius:18px;
  margin-bottom:18px;
}

#jam{
  font-size:34px;
  font-weight:bold;
}

#tanggalSekarang{
  margin-top:5px;
  font-size:14px;
}

.card{
  background:white;
  color:#123;
  padding:22px;
  border-radius:20px;
  box-shadow:0 10px 30px #0005;
}

label{
  display:block;
  font-weight:bold;
  color:#004b9b;
  margin-bottom:7px;
}

input,select{
  width:100%;
  padding:14px;
  margin-bottom:16px;
  border:2px solid #b9ddff;
  border-radius:12px;
  font-size:16px;
  background:white;
}

button{
  width:100%;
  padding:17px;
  border:0;
  border-radius:13px;
  background:#006cff;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  touch-action:manipulation;
}

button:active{
  transform:scale(.97);
}

#hasil{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
  display:none;
}

.footer{
  text-align:center;
  margin-top:20px;
  font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>ABSENSI SISWA X TKJ</h1>
<div class="subtitle">Silahkan isi absen kamu hari ini</div>

<div class="clock">
  <div id="jam">00:00:00</div>
  <div id="tanggalSekarang">Memuat...</div>
  <small>WIB • UTC+7</small>
</div>

<div class="card">

<label>Nama Siswa</label>
<input id="nama" type="text" placeholder="Masukkan nama kamu">

<label>Status Kehadiran</label>
<select id="status">
  <option value="">-- Pilih Status --</option>
  <option value="Hadir">Hadir</option>
  <option value="Izin">Izin</option>
  <option value="Sakit">Sakit</option>
</select>

<label>Tanggal</label>
<input id="tanggal" type="date">

<label>Waktu</label>
<input id="waktu" type="time">

<button type="button" id="tombolAbsen" onclick="kirimAbsensi()">
  ABSEN SEKARANG
</button>

<div id="hasil"></div>

</div>

<div class="footer">
DEV:IMZZ PBLOW
</div>

</div>

<script>

/* EMAILJS */
emailjs.init({
  publicKey: "4kylOzufy35Y1nPec"
});


/* JAM REAL TIME */
function updateJam(){

  const sekarang = new Date();

  const jam = new Intl.DateTimeFormat("id-ID",{
    timeZone:"Asia/Jakarta",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:false
  }).format(sekarang);

  const tanggal = new Intl.DateTimeFormat("id-ID",{
    timeZone:"Asia/Jakarta",
    weekday:"long",
    day:"numeric",
    month:"long",
    year:"numeric"
  }).format(sekarang);

  document.getElementById("jam").innerText = jam;
  document.getElementById("tanggalSekarang").innerText = tanggal;

  /* tanggal YYYY-MM-DD */
  const bagianTanggal = new Intl.DateTimeFormat("en-CA",{
    timeZone:"Asia/Jakarta",
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  }).format(sekarang);

  document.getElementById("tanggal").value = bagianTanggal;

  /* waktu */
  const bagianWaktu = new Intl.DateTimeFormat("en-GB",{
    timeZone:"Asia/Jakarta",
    hour:"2-digit",
    minute:"2-digit",
    hour12:false
  }).format(sekarang);

  document.getElementById("waktu").value = bagianWaktu;
}

updateJam();
setInterval(updateJam,1000);


/* KIRIM ABSENSI */
async function kirimAbsensi(){

  const nama = document.getElementById("nama").value.trim();
  const status = document.getElementById("status").value;
  const tanggal = document.getElementById("tanggal").value;
  const waktu = document.getElementById("waktu").value;

  const hasil = document.getElementById("hasil");
  const tombol = document.getElementById("tombolAbsen");

  if(nama === ""){
    tampilkan("❌ Nama belum diisi.","#ffdede","#a00000");
    return;
  }

  if(status === ""){
    tampilkan("❌ Pilih status kehadiran.","#ffdede","#a00000");
    return;
  }

  tombol.innerText = "MENGIRIM...";
  tombol.disabled = true;

  const data = {
    student_name:nama,
    attendance_status:status,
    attendance_date:tanggal,
    attendance_time:waktu,
    timezone:"WIB (UTC+7)"
  };

  try{

    await emailjs.send(
      "service_rjqw1kj",
      "template_pi4wpud",
      data
    );

    tampilkan(
      "✅ ABSENSI BERHASIL DIKIRIM!",
      "#d9ffe5",
      "#08752d"
    );

    document.getElementById("nama").value="";
    document.getElementById("status").value="";

  }catch(error){

    console.error(error);

    tampilkan(
      "❌ Gagal mengirim: " +
      (error.text || error.message || "Periksa EmailJS"),
      "#ffdede",
      "#a00000"
    );

  }

  tombol.innerText="ABSEN SEKARANG";
  tombol.disabled=false;
}


/* PESAN */
function tampilkan(teks,bg,color){

  const hasil=document.getElementById("hasil");

  hasil.innerText=teks;
  hasil.style.display="block";
  hasil.style.background=bg;
  hasil.style.color=color;
}

</script>

</body>
</html>
